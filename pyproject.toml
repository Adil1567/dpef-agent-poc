[project]
name = "research-chat-agent"
version = "0.1.0"
description = "A LangGraph chat agent that decides per turn whether to answer directly or research the web via Firecrawl."
requires-python = ">=3.10"
dependencies = [
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-openai>=0.2.0",
    "firecrawl-py>=1.0.0",
    "gradio>=4.44.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["research_chat_agent*"]
