schema: spec-driven

context: |
  This repo hosts dpef-agent: a Claude Code skill pair (dpef-init and
  dpef-build-feature) that turns DPO feature requests into human-gated
  GitHub PRs, plus the OpenSpec extension work (spec-driven-pr schema and
  openspec-pr-lifecycle skill) that gives OpenSpec changes their own PR
  tracking, comment triage, and archive-time status reconciliation.

rules:
  tasks:
    - Break tasks into chunks small enough to verify with a single command
      or a single live test, not just "implement X"

operations:
  apply:
    guidance:
      - Prefer live verification (run the code, check real output) over
        marking a task done from reasoning alone
